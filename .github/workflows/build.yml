name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build-output.log | tail -3

      - name: Save build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-output.log

      - name: Report error tail as annotations
        if: failure()
        run: |
          {
            echo '===== 编译错误行 ====='
            grep -E "^e: " build-output.log | tail -30
            echo '===== 日志最后 2200 字符 ====='
            tail -c 2200 build-output.log
          } > errtail.txt 2>/dev/null || tail -c 8500 build-output.log > errtail.txt
          python3 - <<'EOF'
          import base64
          data = open('errtail.txt', 'rb').read()
          chunks = [data[i:i + 700] for i in range(0, len(data), 700)]
          for i, c in enumerate(chunks):
              print(f"::error title=err{i}::{base64.b64encode(c).decode()}")
          EOF

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: live-subtitles-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish release (手机可直接下载)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.0 "app/build/outputs/apk/debug/app-debug.apk" \
            --title "实时字幕 v1.0" --notes "最新自动构建的 APK，下载后直接安装" \
            || gh release upload v1.0 "app/build/outputs/apk/debug/app-debug.apk" --clobber
